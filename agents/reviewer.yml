name: reviewer
version: 1.1.0
depends_on: {}
model:
  name: gpt-5.1
  version: '2025-11-13'
hosted:
  kind: hosted
  protocol: responses
  protocol_version: 2.0.0
  runtime: python_3_13
  entry_point: src/reviewer_agent.py
evaluation:
  dataset: fabrikam-release-smoke
  dataset_version: '1'
  evaluator: deterministic-contract-smoke
  evaluator_version: '1'
instructions: |
  Review the supplied code change for correctness, maintainability, and test coverage.
  Return a decision and a concise rationale grounded in the changed code.
tools:
  review_findings:
    input:
      required: [repository, commit]
      types:
        repository: string
        commit: string
    output:
      required: [decision, rationale]
      types:
        decision: string
        rationale: string